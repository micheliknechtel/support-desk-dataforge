skill_version: "0.1.0"

project:
  name: "support-desk"
  store_name: "support_metric_store"
  repository: null

platform:
  engine: "duckdb"
  pipeline_framework: "spark_python"
  duckdb_dir: "warehouse"
  zones:
    - id: "zone1"
      profile: null
      env: "local"
      path: "warehouse/zone1.duckdb"
    - id: "zone2"
      profile: null
      env: "local"
      path: "warehouse/zone2.duckdb"
  deployment_order: ["zone1", "zone2"]

dbt:
  project_dir: "."
  profiles_dir: "~/.dbt"
  target: "prod"
  schema_generation: "raw_ddl"

source_metadata:
  discovery_method: "information_schema"
  catalog_list_query: "SELECT database_name FROM duckdb_databases() WHERE NOT internal"
  schema_list_query: "SELECT schema_name FROM information_schema.schemata"
  table_list_query: "SELECT table_schema, table_name FROM information_schema.tables WHERE table_schema = '{schema}'"
  table_describe_query: "DESCRIBE {schema}.{table}"
  column_metadata_query: >-
    SELECT column_name, data_type, is_nullable
    FROM information_schema.columns
    WHERE table_schema = '{schema}'
      AND table_name = '{table}'
    ORDER BY ordinal_position
  date_column_query: >-
    SELECT column_name, data_type
    FROM information_schema.columns
    WHERE table_schema = '{schema}'
      AND table_name = '{table}'
      AND (data_type LIKE '%TIMESTAMP%' OR data_type LIKE '%DATE%')
    ORDER BY ordinal_position
  row_count_query: "SELECT COUNT(*) AS total_rows FROM {schema}.{table}"
  date_range_query: "SELECT MIN({date_column}) AS min_date, MAX({date_column}) AS max_date, COUNT(*) AS total_rows FROM {schema}.{table}"
  top_k_distribution_query: "SELECT {column}, COUNT(*) AS cnt, ROUND(100.0 * COUNT(*) / SUM(COUNT(*)) OVER (), 2) AS row_pct FROM {schema}.{table} WHERE {column} IS NOT NULL GROUP BY {column} ORDER BY cnt DESC LIMIT {limit}"
  table_format: "duckdb"
  version_history:
    enabled: false
    unsupported_reason: "duckdb has no transactional table history; recover by re-running the load for the affected date range"

catalogs:
  sources:
    - name: "source_a_gold"
      pattern: "demo_gold_source_a{zone_suffix}"
      layer: "gold"
  targets:
    - name: "metric_store"
      pattern: "demo_gold_support_metric_store{zone_suffix}"
      layer: "gold"
  zone_exceptions: {}

naming:
  metric_pattern: "total_{singular_entity}_{present_verb}_count"
  metric_regex: "^total_[a-z]+(_[a-z]+)*_(create|close|resolve)_count$"
  verbs: ["create", "close", "resolve"]
  singularization:
    incidents: "incident"
    tickets: "ticket"
  cte_case: "snake_case"
  column_case: "lowercase_snake_case"
  system_columns:
    uppercase: ["SNAPSHOT_DATE", "LOAD_TIMESTAMP", "SOURCE_ZONE"]

grains:
  account:
    columns: ["account_id"]
    table_suffix: "Account_Metrics_Snapshot"
  workspace:
    columns: ["account_id", "workspace_id"]
    table_suffix: "Workspace_Metrics_Snapshot"
  user:
    columns: ["account_id", "user_id"]
    table_suffix: "User_Metrics_Snapshot"

domains:
  service_delivery:
    tools: ["incident", "ticket"]

tool_name_overrides: {}
user_grain_excluded_tools: {}
table_prefix_overrides: {}
folder_name_overrides: {}
virtual_tools: {}

downstream:
  integrations: []

orchestration:
  supported: false
  unsupported_reason: "duckdb has no job scheduler; forge-dbx executes SQL directly per zone"
  jobs: {}
  domain_jobs: {}
  file_patterns:
    schema_ddl: "support_metric_store/**/Schema/*.sql"
    alter_ddl: "support_metric_store/**/Schema/Alter/*.sql"
    workflow_json: "workflows/job_definitions/support_metric_store/*.json"
    pipeline_code: "support_metric_store/**/Code/*.py"
    dbt_models: "models/**/*.sql"
    dbt_schema: "models/**/*.yml"
    dbt_macros: "macros/**/*.sql"

runner:
  daily: "support_metric_store/common/daily_runner.py"
  cumulative: "support_metric_store/common/cumulative_runner.py"
  config: "support_metric_store/common/config.py"
  injection_pattern: "exec"
  injected_globals:
    - "SOURCE_ZONE"
    - "SOURCE_ZONE_SUFFIX"
    - "SNAPSHOT_DATE"
    - "SOURCE_CATALOG"
    - "TARGET_CATALOG"
    - "CADENCE"

spark_conf: {}

entity_structure:
  code_dir: "Code"
  schema_dir: "Schema"
  alter_dir: "Alter"
  backfill_dir: null
  daily_suffix: "_Metrics_Snapshot_Daily.py"
  cumulative_suffix: "_Metrics_Snapshot_Cumulative.py"
  schema_pattern: "{Entity}_{Grain}_Metrics_Snapshot_{Cadence}.sql"
